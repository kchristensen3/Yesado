<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Full bleed background for iOS Apple Touch Icon (iOS clips to squircle automatically) -->
  <rect width="512" height="512" fill="url(#appleBg)" />
  
  <!-- Subtle inner gradient glow for rich depth -->
  <circle cx="256" cy="200" r="220" fill="#34D399" opacity="0.15" />
  
  <!-- Friendly house roof accent -->
  <path d="M144 220 L256 128 L368 220" stroke="#A7F3D0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" fill="none" />
  
  <!-- Bold joyful celebratory checkmark -->
  <path d="M160 294 L224 358 L360 216" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Playful celebratory star sparkle in upper right -->
  <path d="M384 84 L396 118 L430 130 L396 142 L384 176 L372 142 L338 130 L372 118 Z" fill="url(#sparkleGrad)" />
</svg>
